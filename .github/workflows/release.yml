# release.yml（T7.2，10 文档 §4 定案）：
#   tag v* 触发 → 三平台矩阵 lint+test+build → artifact → 汇总上传 GitHub Draft Release。
# 产物矩阵：
#   Linux   deb（nfpm）+ AppImage（linuxdeploy）+ 裸二进制 tar.gz 兜底
#   Windows Setup.exe（wails build -nsis）
#   macOS   universal（x64+arm64）.app → dmg（hdiutil）
# 缓存：go-build（~/.cache/go-build）与模块（~/go/pkg/mod）由 setup-go 内建缓存
#   （key 随 go.sum 失效）；wails CLI / nfpm 按 WAILS_VERSION/NFPM_VERSION 缓存；
#   Windows NSIS 工具（%LOCALAPPDATA%/wails2/nsis）随 wails 版本缓存。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release 上传 Draft Release 所需

env:
  WAILS_VERSION: v2.16.0
  NFPM_VERSION: v2.41.1
  APP_NAME: chinese-chess-ultra-go

jobs:
  build:
    name: ${{ matrix.os }} 打包
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal
    steps:
      - uses: actions/checkout@v4

      # vite 7 要求 node ^20.19 || >=22.12：runner 预装版本不保证，显式固定。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # ~/.cache/go-build + ~/go/pkg/mod，key 随 go.sum 失效

      # ---- 工具缓存：wails CLI / nfpm（key 随版本失效）----
      - name: Cache CLI tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails
            ~/go/bin/nfpm
          key: cli-tools-${{ runner.os }}-${{ env.WAILS_VERSION }}-${{ env.NFPM_VERSION }}

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install nfpm (Linux)
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}

      # ---- Linux 构建依赖（CI 同口径：webkit2gtk-4.0 已从 Ubuntu 24.04+ 源移除，
      #      装 4.1 并以 webkit2_41 标签构建——沿 ci.yml/10 §3 R1'，PROGRESS T0.3）----
      - name: Install GTK/WebKitGTK dev headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # ---- 质量门（09 §4；gofmt 平台无关，跑 Linux 一份即可）----
      - name: Lint (gofmt + go vet)
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Vet
        if: runner.os != 'Linux'
        run: go vet ./...

      # -race 全平台（windows runner 预装 MinGW，M0 ci.yml 实证可跑——
      # 初版误判"无 CGO 工具链"已纠正，DR-012）。
      - name: Go test (-race)
        run: go test ./... -race

      - name: Frontend lint + test (Linux 一份)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:fe

      # ---- 构建 ----
      # wails v2.16 不自动装 NSIS（仅查 PATH 的 makensis，缺则跳过打包）：
      # 模板只用标准 NSIS 组件（MUI/x64/WinVer/FileFunc），choco 标准包即可。
      # choco 安装器写入的系统 PATH 对已启动 job 不可见——显式写入 GITHUB_PATH。
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS\Bin"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -platform linux/amd64 -tags webkit2_41
      - name: Build + NSIS (Windows)
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -nsis
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal

      # ---- 平台打包 ----
      - name: Package deb + AppImage + tar.gz (Linux)
        if: runner.os == 'Linux'
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER_NUM="${VER#v}"
          nfpm package -f build/nfpm.yaml -p deb \
            -t "build/bin/${APP_NAME}_${VER_NUM}_amd64.deb"
          ./build/linux/build-appimage.sh "$VER_NUM"
          tar -czf "build/bin/${APP_NAME}-${VER_NUM}-linux-amd64.tar.gz" -C build/bin "${APP_NAME}"
      - name: Rename installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER_NUM="${VER#v}"
          mv build/bin/*-installer.exe "build/bin/${APP_NAME}-${VER_NUM}-windows-amd64-setup.exe"
      - name: Package dmg (macOS)
        if: runner.os == 'macOS'
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER_NUM="${VER#v}"
          # wails 的 .app bundle 取 wails.json name（chinese_chess_go.app）而非
          # outputfilename——glob 兜底不写死（DR-012 后续修复记录见 K37）。
          APP_BUNDLE="$(ls -d build/bin/*.app | head -1)"
          hdiutil create -volname "中国象棋 Ultra" \
            -srcfolder "$APP_BUNDLE" \
            -ov -format UDZO "build/bin/${APP_NAME}-${VER_NUM}-macos-universal.dmg"

      # ---- artifact：汇总 job 收集上传 Draft Release ----
      - name: Collect artifacts
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER_NUM="${VER#v}"
          mkdir -p dist
          case "${{ runner.os }}" in
            Linux)
              cp "build/bin/${APP_NAME}_${VER_NUM}_amd64.deb" dist/
              cp "build/bin/${APP_NAME}-${VER_NUM}-linux-amd64.AppImage" dist/
              cp "build/bin/${APP_NAME}-${VER_NUM}-linux-amd64.tar.gz" dist/
              ;;
            Windows)
              cp "build/bin/${APP_NAME}-${VER_NUM}-windows-amd64-setup.exe" dist/
              ;;
            macOS)
              cp "build/bin/${APP_NAME}-${VER_NUM}-macos-universal.dmg" dist/
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*

  release:
    name: 汇总上传 Draft Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create 需要 git 上下文解析 tag（无 checkout 时 API 侧可能拿不到
      # 刚推送的 ref，产生 untagged-<hash> 幽灵 draft——v1.0.0-rc1 第 4 轮实证）。
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload GitHub Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ github.ref_name }}
        run: |
          gh release create "$VER" --draft \
            --title "中国象棋 Ultra ${VER}" --generate-notes dist/*
      # 创建后立即自校验：draft 不可见/资产缺失时当场失败（而非产出幽灵 draft）。
      - name: Verify Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ github.ref_name }}
        run: |
          gh release view "$VER" --json isDraft,assets \
            --jq '{draft: .isDraft, assets: [.assets[].name]}'
